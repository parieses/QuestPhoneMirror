name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      # Release 签名：
      # - 未配置 Secret 时，直接使用仓库内置的 app/release.keystore + gradle.properties 默认值（零配置，纯 CI 即用）
      # - 配置了 Secret（RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD）时，优先用 Secret 还原的密钥覆盖
      # 两种方式都产出“正规签名”APK —— 这是澎湃OS/MIUI 放行无障碍权限的前提（debug 签名会被拒签）。
      - name: Setup release keystore
        env:
          SECRET_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_B64" ]; then
            echo "$SECRET_B64" | base64 -d > app/release.keystore
            sed -i '/^RELEASE_/d' gradle.properties
            {
              echo "RELEASE_STORE_FILE=app/release.keystore"
              echo "RELEASE_STORE_PASSWORD=$SECRET_STORE_PW"
              echo "RELEASE_KEY_ALIAS=qpm"
              echo "RELEASE_KEY_PASSWORD=$SECRET_KEY_PW"
            } >> gradle.properties
          fi
          # 未配置 Secret 时不做任何改动，沿用仓库内置默认值与 app/release.keystore

      - name: Build
        id: build
        continue-on-error: true
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 构建失败时把完整日志推到 ci-logs 分支，方便排查
      # 用 orphan 分支：该分支只含 build.log，不带 .github/workflows，
      # 否则 GitHub App 没有 workflows 权限会被拒绝推送
      - name: Push build log to ci-logs
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          git add -f build.log
          git commit -m "ci log ${{ github.run_id }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-logs

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qpm-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/') && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
