name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      # Release 签名：从 GitHub Secrets 还原密钥库（base64），绝不把私钥/密码写进仓库。
      # 需在仓库 Settings → Secrets 配置：
      #   SIGNING_KEY        —— 密钥库文件 app/release.keystore 的 base64（无换行）
      #   KEY_ALIAS          —— 密钥别名（本项目为 qpm）
      #   KEY_STORE_PASSWORD —— 密钥库密码
      #   KEY_PASSWORD       —— 密钥密码
      # 这是澎湃OS/MIUI 放行无障碍权限的前提（debug 签名会被拒签）。
      - name: Restore signing key from Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets。请在仓库 Settings → Secrets 配置 SIGNING_KEY、KEY_ALIAS、KEY_STORE_PASSWORD、KEY_PASSWORD"
            exit 1
          fi
          # 还原密钥库：先剥离复制粘贴可能带入的换行/空格/回车，再解码
          echo "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > app/release.keystore
          echo "还原出的 keystore 大小: $(wc -c < app/release.keystore) 字节"
          # 密码去掉可能误带入的首尾空白；正确值为 qpm-release-2026
          KS_PASS="$(echo "$KEY_STORE_PASSWORD" | tr -d '[:space:]')"
          ERR=$("$JAVA_HOME/bin/keytool" -list -keystore app/release.keystore -storepass "$KS_PASS" 2>&1 >/dev/null)
          if [ $? -ne 0 ]; then
            if echo "$ERR" | grep -qi "password"; then
              echo "::error::密码不对。KEY_STORE_PASSWORD / KEY_PASSWORD 必须为 qpm-release-2026。请到 Secrets 核对这两个值。"
            else
              echo "::error::SIGNING_KEY 解码出的不是有效 keystore，说明 base64 被截断或混入杂质。请重新完整复制 SIGNING_KEY（约 3632 字符，解码后约 2700 字节）。"
            fi
            exit 1
          fi
          {
            echo "RELEASE_STORE_FILE=app/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="dev-${GITHUB_SHA::7}"
          fi
          VNUM="${TAG#v}"
          VCODE=$(echo "$VNUM" | grep -oE '[0-9]+' | paste -sd '' )
          VCODE="${VCODE:-1}"
          VCODE=$((10#$VCODE))
          {
            echo "VERSION_NAME=$TAG"
            echo "VERSION_CODE=$VCODE"
          } >> gradle.properties
          echo "版本: name=$TAG code=$VCODE"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 构建失败时把完整日志推到 ci-logs 分支，方便排查
      # 用 orphan 分支：该分支只含 build.log，不带 .github/workflows，
      # 否则 GitHub App 没有 workflows 权限会被拒绝推送
      - name: Push build log to ci-logs
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          git add -f build.log
          git commit -m "ci log ${{ github.run_id }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-logs

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qpm-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/') && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
