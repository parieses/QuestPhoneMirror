org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 发布签名：私钥与密码不写入仓库（避免泄露），由 CI 通过 GitHub Secrets 注入
# （见 .github/workflows/build-apk.yml 与 README “小米/澎湃OS 无障碍权限”章节）。
# 本地如需构建 release，可在 local.properties 或命令行 -P 提供以下属性：
#   RELEASE_STORE_FILE=app/release.keystore
#   RELEASE_STORE_PASSWORD=...
#   RELEASE_KEY_ALIAS=qpm
#   RELEASE_KEY_PASSWORD=...
# 未提供时 build.gradle.kts 会自动回退到 debug 签名（仅供本地调试，澎湃OS 会拒签）。
