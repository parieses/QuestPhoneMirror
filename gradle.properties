org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 发布签名（仓库内置密钥，用于产出“正规签名”的 release APK，
# 否则澎湃OS/MIUI 会拒绝 debug 签名应用获取无障碍权限。详见 README）。
# 若介意私钥/密码进入公开仓库，可改用 GitHub Secrets 覆盖，并在本地用 local.properties 覆盖。
RELEASE_STORE_FILE=app/release.keystore
RELEASE_STORE_PASSWORD=qpm-release-2026
RELEASE_KEY_ALIAS=qpm
RELEASE_KEY_PASSWORD=qpm-release-2026
